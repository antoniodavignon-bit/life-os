[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "life-os"
version = "0.1.0"
description = "A personal operating system for goals, execution, finances, and review."
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [
    {name = "Antonio Davignon"}
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
life-os = "life_os.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]