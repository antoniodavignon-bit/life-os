[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "life-os"
version = "0.1.0"
description = "A personal operating system for goals, execution, finances, and review."
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [
    {name = "Antonio Davignon"}
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16"]

[project.scripts]
life-os = "life_os.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F  pycodestyle + pyflakes  - correctness baseline
# I    isort                   - deterministic import order
# UP   pyupgrade               - keep syntax current with target-version
# B    flake8-bugbear          - likely-bug patterns
# SIM  flake8-simplify         - readability
# RUF  ruff-specific
#
# Deliberately NOT enabled: DTZ (flake8-datetimez). Life OS is a
# single-user local tool; a naive local timestamp is exactly what the
# user means by "I logged this at 2pm". Making datetimes timezone-aware
# would change the persisted format for no benefit today. Revisit if
# state ever syncs across devices or time zones.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.setuptools.packages.find]
where = ["src"]